<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Caption Hover 5</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 60px 20px;
            background: #f4f4f4;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            text-align: center;
        }

        .grid {
            text-align: center;
        }

        .grid .card {
            display: inline-block;
            margin: 15px;
            vertical-align: top;
        }

        .card {
            position: relative;
            width: 300px;
            height: 220px;
        }

        .card__img {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 60px;
            transition: transform .4s;
        }

        .card:hover .card__img {
            transform: scale(0.4);
        }

        .card__cap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #2c3f52;
            color: #fff;
            text-align: center;
            padding-top: 12px;
            padding-right: 153px;
            opacity: 0;
            transform: scale(0.7);

            transition: transform .4s, opacity .4s;
        }

        .card:hover .card__cap {
            opacity: 1;
            transform: scale(1);
        }

        .card__cap h3 {
            margin: 0;
            font-size: 17px;
        }

        .card__cap span {
            color: #ed4e6e;
            font-size: 12px;
        }

        .card__cap span:before {
            content: "by ";
        }

        .card__cap a {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 6px 14px;
            background: #ed4e6e;
            color: #fff;
            text-decoration: none;
            border-radius: 2px;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="grid">
    <div class="card"><img alt="image" class="card__img" src="images/1.png">
        <div class="card__cap"><h3>Camera</h3><span>Jacob Cummings</span><a href="#">Take a look</a></div>
    </div>
    <div class="card"><img alt="image" class="card__img" src="images/2.png">
        <div class="card__cap"><h3>Music</h3><span>Jacob Cummings</span><a href="#">Take a look</a></div>
    </div>
    <div class="card"><img alt="image" class="card__img" src="images/3.png">
        <div class="card__cap"><h3>Settings</h3><span>Jacob Cummings</span><a href="#">Take a look</a></div>
    </div>
    <div class="card"><img alt="image" class="card__img" src="images/4.png">
        <div class="card__cap"><h3>Safari</h3><span>Jacob Cummings</span><a href="#">Take a look</a></div>
    </div>
</div>
</body>
</html>
