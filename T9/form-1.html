<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>form-1</title>
    <link href="./css-file/form-1.css" rel="stylesheet">
</head>
<body>
<div id="container">
    <div id="login">
        <h1>ثبت نام</h1>
        <form action="#" method="POST">
            <div id="parent">
                <input
                        type="text"
                        class="input"
                        name="username"
                        placeholder="نام"
                        required
                >
                <input
                        type="email"
                        class="input"
                        name="email"
                        placeholder="ایمیل"
                        required
                >
                <input
                        type="password"
                        class="input"
                        name="password"
                        placeholder="کلمه عبور"
                        required
                >
                <h5>
                    <span>قبول کردن تمام </span>
                    <a href="#">
                        قوانین سایت
                    </a>
                </h5>
                <h5 id="h5-inline-block">
                    <span>قبلا ثبت نام کرده اید ؟ </span>
                    <a href="#">
                        ورود
                    </a>
                </h5>
                <input
                        name="submit"
                        type="submit"
                        value="ثیت نام"
                >
            </div>
        </form>
    </div>
    <div id="image-wrapper">
        <img
                alt=""
                src="./images/registration-form.jpg">
    </div>
</div>
</body>
</html>
