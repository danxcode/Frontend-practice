<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>form-3</title>
    <link rel="stylesheet" href="css-file/form-3.css">
</head>
<body>
<div id="container">
    <h1>Login</h1>
    <form action="#">
        <label for="username">Username</label>
        <input
                type="text"
                id="username"
                name="username"
                placeholder="Type Your Username"
                class="form-style"
                required
        />
        <label for="password">Password</label>
        <input
                type="password"
                id="password"
                name="password"
                placeholder="Type Your Password"
                class="form-style"
                required>
        <a href="#" id="forgot-pass">Forgot Password?</a>
        <br>
        <input
                type="submit"
                value="Login"
        >
        <h6>Or Sign Up Using</h6>
        <a href="#">
            <img
                    src="images/images.png"
                    alt="facebook"
                    class="a-style"
                    id="a-firs">
        </a>
        <a href="#">
            <img
                    src="images/images%20(1).png"
                    alt="twitter"
                    class="a-style">
        </a>
        <a href="#">
            <img
                    src="images/images%20(1).jpg"
                    alt="google"
                    class="a-style">
        </a>
    </form>
    <h6 id="last-h6">Or Sign Up Using</h6>
    <a href="#">
        <h6 id="last-h6-2">SIGN UP</h6>
    </a>
</div>
</body>
</html>
