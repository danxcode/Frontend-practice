<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>form-2</title>
    <link rel="stylesheet" href="./css-file/form-2.css">
</head>
<body>
<div id="container">
    <h1>Login #10</h1>
    <h2>Have an account?</h2>
    <form action="#">
        <input
                type="text"
                name="Username"
                placeholder="Username"
                class="form-style"
                required
        >
        <input
                type="password"
                name="Password"
                placeholder="Password"
                class="form-style"
                required
        >
        <input
                type="submit"
                name="submit"
                value="Sign In"
                class="form-style"
        >
        <input
                type="checkbox"
                name="remember-me"
                id="remember-me"
        >
        <label for="remember-me">Remember me</label>
        <a href="#" id="forgot-btn">Forgot Password</a>
        <h4>-Or Sign In With-</h4>
        <a href="#" class="a-style" id="a">Facebook</a>
        <a href="#" class="a-style">Twitter</a>
    </form>
</div>
</body>
</html>
